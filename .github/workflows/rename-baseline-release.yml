name: Rename baseline release display title

on:
  push:
    branches:
      - ci/baseline-restore-smoke
    paths:
      - .github/workflows/rename-baseline-release.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Remove Kiwi from release display title only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: kiwi-baseline-m153-fa41ecbd6f784035336214537d19505d52026713
        run: |
          set -Eeuo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Titanium M153 build baseline"
