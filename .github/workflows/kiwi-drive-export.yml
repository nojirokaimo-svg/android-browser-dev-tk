name: Export Titanium-Kiwi baseline for Drive handoff

on:
  push:
    branches:
      - ci/drive-baseline-export
    paths:
      - .github/workflows/kiwi-drive-export.yml

permissions:
  contents: read

jobs:
  export-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Download and verify durable Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: kiwi-baseline-m153-fa41ecbd6f784035336214537d19505d52026713
        run: |
          set -Eeuo pipefail
          mkdir -p drive-export
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern baseline-manifest.json \
            --pattern out-default.tar.zst.part-0000 \
            --pattern out-default.tar.zst.part-0001 \
            --dir drive-export \
            --clobber
          echo "ddd53dbcc844b70d82d38c0f34fe73e9bf9aca4252f1e8f5c2e6b3c9f907b04e  drive-export/baseline-manifest.json" | sha256sum -c -
          echo "046ee77cd217aa07efbd718034a50645934342dc3ab037b1700afe19ecf60f0a  drive-export/out-default.tar.zst.part-0000" | sha256sum -c -
          echo "600bccec5001913278af4798e2a1646a9edb7a10f427340dc881abb8d24d449e  drive-export/out-default.tar.zst.part-0001" | sha256sum -c -

      - name: Split for Drive connector
        shell: bash
        run: |
          set -Eeuo pipefail
          split -b 100000000 -d -a 2 drive-export/out-default.tar.zst.part-0000 drive-export/part-0000.chunk-
          split -b 100000000 -d -a 2 drive-export/out-default.tar.zst.part-0001 drive-export/part-0001.chunk-
          cat > drive-export/DRIVE-RESTORE.txt <<'EOF'
          Titanium-Kiwi M153 durable baseline
          Unzip every Drive chunk artifact first, then:
          cat part-0000.chunk-* > out-default.tar.zst.part-0000
          cat part-0001.chunk-* > out-default.tar.zst.part-0001

          SHA256:
          baseline-manifest.json ddd53dbcc844b70d82d38c0f34fe73e9bf9aca4252f1e8f5c2e6b3c9f907b04e
          out-default.tar.zst.part-0000 046ee77cd217aa07efbd718034a50645934342dc3ab037b1700afe19ecf60f0a
          out-default.tar.zst.part-0001 600bccec5001913278af4798e2a1646a9edb7a10f427340dc881abb8d24d449e
          EOF

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: drive100-manifest
          path: |
            drive-export/baseline-manifest.json
            drive-export/DRIVE-RESTORE.txt
          compression-level: 0
          retention-days: 1

      - name: Upload p0000 c00
        uses: actions/upload-artifact@v4
        with: {name: drive100-p0000-c00, path: drive-export/part-0000.chunk-00, compression-level: 0, retention-days: 1}

      - name: Upload p0000 c01
        uses: actions/upload-artifact@v4
        with: {name: drive100-p0000-c01, path: drive-export/part-0000.chunk-01, compression-level: 0, retention-days: 1}

      - name: Upload p0000 c02
        uses: actions/upload-artifact@v4
        with: {name: drive100-p0000-c02, path: drive-export/part-0000.chunk-02, compression-level: 0, retention-days: 1}

