name: Prepare Chromium 156 Kiwi rebase candidate
on:
  workflow_dispatch:
  push:
    branches:
      - codex/kiwi-ui-port
    paths:
      - .github/workflows/kiwi-156-rebase.yml
      - kiwi_port/rebase_156_audit.py

permissions:
  contents: write
  actions: read

concurrency:
  group: kiwi-156-rebase-candidate
  cancel-in-progress: false

jobs:
  rebase-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Fetch previous M156 actual-source audit artifact, no new Chromium checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/kiwi156-audit"
          gh run download 39891910191 --repo "$GITHUB_REPOSITORY" --name kiwi-ui-source-audit-kiwi-15647-audit-301e00c707284b58b73c4c407ead776fd58e885a-39891910191-1 --dir "$RUNNER_TEMP/kiwi156-audit"
          test -s "$RUNNER_TEMP/kiwi156-audit/kiwi-sources-before.tar.gz"
          test -s "$RUNNER_TEMP/kiwi156-audit/kiwi-source-hashes-before.json"
          test -s "$RUNNER_TEMP/kiwi156-audit/kiwi-patch-report.json"
      - name: Rebase candidate patches from verified actual M156 files (no compile or cache writes)
        shell: bash
        run: python3 kiwi_port/rebase_156_audit.py
      - name: Commit audited M156 candidate patches on success only
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('output/kiwi156-rebase-candidate/results.json').read_text())
          if status['status'] != 'pass' or len(status['events']) != 25:
              raise SystemExit('M156 audit did not certify all 25 patches')
          PY
          python3 kiwi_port/verify_series.py
          git diff --check
          git add kiwi_port/manifest.json kiwi_port/patches/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Rebase and verify all 25 Kiwi UI patches for Chromium 156 [skip ci]"
          git push origin HEAD:codex/kiwi-ui-port
      - name: Upload rebase candidate and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-156-rebase-candidate-${{ github.run_id }}
          path: output/kiwi156-rebase-candidate/
          if-no-files-found: error
          retention-days: 14
