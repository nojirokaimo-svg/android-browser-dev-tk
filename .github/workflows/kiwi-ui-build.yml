name: Build Titanium-Kiwi core

on:
  workflow_dispatch:
  push:
    branches:
      - codex/kiwi-ui-port

permissions:
  contents: read
  actions: write

concurrency:
  group: titanium-kiwi-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-15584:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          # Restore the exact completed #178 checkpoint and return it untouched.
          restore-key: kiwi-incremental-15579-4d72ba1aa77606a63f6f57022c2416ffc27cc31b-38576318413-1-continue-2
          require-restore: "true"
          audit-only: "true"
          bootstrap-revision: ""
          transition-from-identity: ""
          save-key: kiwi-15584-audit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          final-cache-key: ""
          titanium-commit: e59e03dc83bc940d73cf29a7683286fca390b393
          vanadium-commit: 20526e052e304b62cf3e80114b423934e2d1c540
          chromium-commit: 5869fe313571d75152b77813cf0a4ee26a4e6df0
          chromium-version: 155.0.8059.84
          # Diagnostic-only; unresolved conflicts are never compiled.
          patch-mode: best-effort
          build-budget-minutes: "270"
