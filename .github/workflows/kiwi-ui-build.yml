name: Build Titanium-Kiwi core M156.47

on:
  workflow_dispatch:
  push:
    branches:
      - codex/kiwi-ui-port
    paths:
      - .github/workflows/kiwi-ui-build.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: titanium-kiwi-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          # Build #180 completed this exact M155.84 checkpoint. Keep Ninja history and
          # object/generated files; a cache miss stops the build.
          restore-key: kiwi-incremental-15584-acdde2860b6a4ee2f777920fbabaafa571cf909c-39044652662-1-continue-2
          require-restore: "true"
          # Explicit verified M155.84 -> M156 source transition. Preserve original out/Default Ninja history.
          bootstrap-revision: ""
          transition-from-identity: "e59e03dc83bc940d73cf29a7683286fca390b393:20526e052e304b62cf3e80114b423934e2d1c540:5869fe313571d75152b77813cf0a4ee26a4e6df0:validation"
          save-key: kiwi-15647-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          final-cache-key: kiwi-incremental-15647-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          titanium-commit: a3e4b86339a8db237d95d8e8e78248c8f6a1df68
          vanadium-commit: 2ae4335402eabcc6e025f3400185fe25094d8521
          chromium-commit: 1d17a2e2ee147bb7d6ae2ab6abdb3a2510c17775
          chromium-version: 156.0.8078.47
          patch-mode: strict
          build-budget-minutes: "270"

  continue-1:
    needs: build
    if: needs.build.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15647-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          require-restore: "true"
          save-key: kiwi-15647-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          final-cache-key: kiwi-incremental-15647-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          titanium-commit: a3e4b86339a8db237d95d8e8e78248c8f6a1df68
          vanadium-commit: 2ae4335402eabcc6e025f3400185fe25094d8521
          chromium-commit: 1d17a2e2ee147bb7d6ae2ab6abdb3a2510c17775
          chromium-version: 156.0.8078.47
          patch-mode: strict
          build-budget-minutes: "270"

  continue-2:
    needs: continue-1
    if: needs.continue-1.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15647-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          require-restore: "true"
          save-key: kiwi-15647-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          final-cache-key: kiwi-incremental-15647-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          titanium-commit: a3e4b86339a8db237d95d8e8e78248c8f6a1df68
          vanadium-commit: 2ae4335402eabcc6e025f3400185fe25094d8521
          chromium-commit: 1d17a2e2ee147bb7d6ae2ab6abdb3a2510c17775
          chromium-version: 156.0.8078.47
          patch-mode: strict
          build-budget-minutes: "270"

  continue-3:
    needs: continue-2
    if: needs.continue-2.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15647-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          require-restore: "true"
          save-key: kiwi-15647-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          final-cache-key: kiwi-incremental-15647-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          titanium-commit: a3e4b86339a8db237d95d8e8e78248c8f6a1df68
          vanadium-commit: 2ae4335402eabcc6e025f3400185fe25094d8521
          chromium-commit: 1d17a2e2ee147bb7d6ae2ab6abdb3a2510c17775
          chromium-version: 156.0.8078.47
          patch-mode: strict
          build-budget-minutes: "270"

  continue-4:
    needs: continue-3
    if: needs.continue-3.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15647-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          require-restore: "true"
          save-key: kiwi-15647-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-4
          final-cache-key: kiwi-incremental-15647-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-4
          titanium-commit: a3e4b86339a8db237d95d8e8e78248c8f6a1df68
          vanadium-commit: 2ae4335402eabcc6e025f3400185fe25094d8521
          chromium-commit: 1d17a2e2ee147bb7d6ae2ab6abdb3a2510c17775
          chromium-version: 156.0.8078.47
          patch-mode: strict
          build-budget-minutes: "270"

  require-apk:
    needs: [build, continue-1, continue-2, continue-3, continue-4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require one stage to finish the APK
        env:
          S11: ${{ needs.build.outputs.done }}
          S12: ${{ needs.continue-1.outputs.done }}
          S13: ${{ needs.continue-2.outputs.done }}
          S14: ${{ needs.continue-3.outputs.done }}
          S15: ${{ needs.continue-4.outputs.done }}
        run: |
          if [[ "$S11" != true && "$S12" != true && "$S13" != true && "$S14" != true && "$S15" != true ]]; then
            echo "Build and exact-cache continuations ended without producing an APK." >&2
            exit 1
          fi
