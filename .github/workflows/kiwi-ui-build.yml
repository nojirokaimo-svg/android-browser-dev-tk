name: Build Titanium-Kiwi core

on:
  workflow_dispatch:
  push:
    branches:
      - codex/kiwi-ui-port

permissions:
  contents: read
  actions: write

concurrency:
  group: titanium-kiwi-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-6:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          # Resume is deliberately exact: never fall back to an older/empty
          # checkpoint and never start another cold multi-hour compile.
          restore-key: kiwi-153-d7d74a667baca929bea9be32749c8a7c301c1333-stage-5
          require-restore: "true"
          # Build #148 saved this immutable stage-5 checkpoint after the
          # upstream transition. Resume its Ninja history without repeating GN.
          bootstrap-revision: ""
          transition-from-identity: ""
          save-key: kiwi-153-${{ github.sha }}-stage-6
          final-cache-key: kiwi-incremental-153-${{ github.sha }}-stage-6
          titanium-commit: 97a21b7a98e4446142a39bd38190023ebb34cd74
          vanadium-commit: 2aaf9dfc919e620564409f94beedaedca5301e81
          chromium-commit: 78e5e45d4bb41035e17ea4da2cc257f496416ac9
          chromium-version: 153.0.8010.52
          patch-mode: best-effort
          build-budget-minutes: "90"

  stage-7:
    needs: stage-6
    if: needs.stage-6.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-153-${{ github.sha }}-stage-6
          require-restore: "true"
          save-key: kiwi-153-${{ github.sha }}-stage-7
          final-cache-key: kiwi-incremental-153-${{ github.sha }}-stage-7
          titanium-commit: 97a21b7a98e4446142a39bd38190023ebb34cd74
          vanadium-commit: 2aaf9dfc919e620564409f94beedaedca5301e81
          chromium-commit: 78e5e45d4bb41035e17ea4da2cc257f496416ac9
          chromium-version: 153.0.8010.52
          patch-mode: best-effort
          build-budget-minutes: "90"

  stage-8:
    needs: stage-7
    if: needs.stage-7.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-153-${{ github.sha }}-stage-7
          require-restore: "true"
          save-key: kiwi-153-${{ github.sha }}-stage-8
          final-cache-key: kiwi-incremental-153-${{ github.sha }}-stage-8
          titanium-commit: 97a21b7a98e4446142a39bd38190023ebb34cd74
          vanadium-commit: 2aaf9dfc919e620564409f94beedaedca5301e81
          chromium-commit: 78e5e45d4bb41035e17ea4da2cc257f496416ac9
          chromium-version: 153.0.8010.52
          patch-mode: best-effort
          build-budget-minutes: "90"

  stage-9:
    needs: stage-8
    if: needs.stage-8.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-153-${{ github.sha }}-stage-8
          require-restore: "true"
          save-key: kiwi-153-${{ github.sha }}-stage-9
          final-cache-key: kiwi-incremental-153-${{ github.sha }}-stage-9
          titanium-commit: 97a21b7a98e4446142a39bd38190023ebb34cd74
          vanadium-commit: 2aaf9dfc919e620564409f94beedaedca5301e81
          chromium-commit: 78e5e45d4bb41035e17ea4da2cc257f496416ac9
          chromium-version: 153.0.8010.52
          patch-mode: best-effort
          build-budget-minutes: "90"

  stage-10:
    needs: stage-9
    if: needs.stage-9.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-153-${{ github.sha }}-stage-9
          require-restore: "true"
          save-key: kiwi-153-${{ github.sha }}-stage-10
          final-cache-key: kiwi-incremental-153-${{ github.sha }}-stage-10
          titanium-commit: 97a21b7a98e4446142a39bd38190023ebb34cd74
          vanadium-commit: 2aaf9dfc919e620564409f94beedaedca5301e81
          chromium-commit: 78e5e45d4bb41035e17ea4da2cc257f496416ac9
          chromium-version: 153.0.8010.52
          patch-mode: best-effort
          build-budget-minutes: "90"

  require-apk:
    needs: [stage-6, stage-7, stage-8, stage-9, stage-10]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require one stage to finish the APK
        env:
          S6: ${{ needs.stage-6.outputs.done }}
          S7: ${{ needs.stage-7.outputs.done }}
          S8: ${{ needs.stage-8.outputs.done }}
          S9: ${{ needs.stage-9.outputs.done }}
          S10: ${{ needs.stage-10.outputs.done }}
        run: |
          if [[ "$S6" != true && "$S7" != true && "$S8" != true && "$S9" != true && "$S10" != true ]]; then
            echo "Stage 6-10 continuation checkpoints completed without producing an APK." >&2
            exit 1
          fi
