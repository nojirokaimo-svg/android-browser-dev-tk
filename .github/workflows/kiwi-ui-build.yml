name: Build Titanium-Kiwi core

on:
  workflow_dispatch:
  push:
    branches:
      - codex/kiwi-ui-port

permissions:
  contents: read
  actions: write

concurrency:
  group: titanium-kiwi-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-11:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          # Resume is deliberately exact: never fall back to an older/empty
          # checkpoint and never start another cold multi-hour compile.
          restore-key: kiwi-incremental-153-addbe54fe875cd72e8c0c1543930ea0549fef857-stage-11
          require-restore: "true"
          # Build #151 saved the signed APK and the immutable stage-11 output.
          # Revalidate metadata-only changes while retaining all Ninja outputs.
          bootstrap-revision: ""
          transition-from-identity: ""
          save-key: kiwi-153-${{ github.sha }}-stage-11
          final-cache-key: kiwi-incremental-153-${{ github.sha }}-stage-11
          titanium-commit: 97a21b7a98e4446142a39bd38190023ebb34cd74
          vanadium-commit: 2aaf9dfc919e620564409f94beedaedca5301e81
          chromium-commit: 78e5e45d4bb41035e17ea4da2cc257f496416ac9
          chromium-version: 153.0.8010.52
          patch-mode: best-effort
          build-budget-minutes: "90"

  stage-12:
    needs: stage-11
    if: needs.stage-11.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-153-${{ github.sha }}-stage-11
          require-restore: "true"
          save-key: kiwi-153-${{ github.sha }}-stage-12
          final-cache-key: kiwi-incremental-153-${{ github.sha }}-stage-12
          titanium-commit: 97a21b7a98e4446142a39bd38190023ebb34cd74
          vanadium-commit: 2aaf9dfc919e620564409f94beedaedca5301e81
          chromium-commit: 78e5e45d4bb41035e17ea4da2cc257f496416ac9
          chromium-version: 153.0.8010.52
          patch-mode: best-effort
          build-budget-minutes: "90"

  stage-13:
    needs: stage-12
    if: needs.stage-12.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-153-${{ github.sha }}-stage-12
          require-restore: "true"
          save-key: kiwi-153-${{ github.sha }}-stage-13
          final-cache-key: kiwi-incremental-153-${{ github.sha }}-stage-13
          titanium-commit: 97a21b7a98e4446142a39bd38190023ebb34cd74
          vanadium-commit: 2aaf9dfc919e620564409f94beedaedca5301e81
          chromium-commit: 78e5e45d4bb41035e17ea4da2cc257f496416ac9
          chromium-version: 153.0.8010.52
          patch-mode: best-effort
          build-budget-minutes: "90"

  stage-14:
    needs: stage-13
    if: needs.stage-13.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-153-${{ github.sha }}-stage-13
          require-restore: "true"
          save-key: kiwi-153-${{ github.sha }}-stage-14
          final-cache-key: kiwi-incremental-153-${{ github.sha }}-stage-14
          titanium-commit: 97a21b7a98e4446142a39bd38190023ebb34cd74
          vanadium-commit: 2aaf9dfc919e620564409f94beedaedca5301e81
          chromium-commit: 78e5e45d4bb41035e17ea4da2cc257f496416ac9
          chromium-version: 153.0.8010.52
          patch-mode: best-effort
          build-budget-minutes: "90"

  stage-15:
    needs: stage-14
    if: needs.stage-14.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-153-${{ github.sha }}-stage-14
          require-restore: "true"
          save-key: kiwi-153-${{ github.sha }}-stage-15
          final-cache-key: kiwi-incremental-153-${{ github.sha }}-stage-15
          titanium-commit: 97a21b7a98e4446142a39bd38190023ebb34cd74
          vanadium-commit: 2aaf9dfc919e620564409f94beedaedca5301e81
          chromium-commit: 78e5e45d4bb41035e17ea4da2cc257f496416ac9
          chromium-version: 153.0.8010.52
          patch-mode: best-effort
          build-budget-minutes: "90"

  require-apk:
    needs: [stage-11, stage-12, stage-13, stage-14, stage-15]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require one stage to finish the APK
        env:
          S11: ${{ needs.stage-11.outputs.done }}
          S12: ${{ needs.stage-12.outputs.done }}
          S13: ${{ needs.stage-13.outputs.done }}
          S14: ${{ needs.stage-14.outputs.done }}
          S15: ${{ needs.stage-15.outputs.done }}
        run: |
          if [[ "$S11" != true && "$S12" != true && "$S13" != true && "$S14" != true && "$S15" != true ]]; then
            echo "Stage 11-15 exact-cache continuation completed without producing an APK." >&2
            exit 1
          fi
