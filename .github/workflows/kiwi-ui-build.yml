name: Audit Titanium-Kiwi 156.0.8078.47 sources safely

on:
  workflow_dispatch:
  push:
    branches:
      - codex/kiwi-ui-port

permissions:
  contents: read
  actions: write

concurrency:
  group: titanium-kiwi-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-15647:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          # Verified M155.84 completed checkpoint from Build #180.
          # An exact cache miss fails closed: no cold build or prefix fallback.
          restore-key: kiwi-incremental-15584-acdde2860b6a4ee2f777920fbabaafa571cf909c-39044652662-1-continue-2
          require-restore: "true"
          # Audit-only: do not compile, save caches, alter completed checkpoint, or sign APK.
          audit-only: "true"
          bootstrap-revision: ""
          transition-from-identity: ""
          save-key: kiwi-15647-audit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          final-cache-key: ""
          titanium-commit: a3e4b86339a8db237d95d8e8e78248c8f6a1df68
          vanadium-commit: 2ae4335402eabcc6e025f3400185fe25094d8521
          chromium-commit: 1d17a2e2ee147bb7d6ae2ab6abdb3a2510c17775
          chromium-version: 156.0.8078.47
          # Only collect actual before/after sources and conflict diagnostics.
          # Production must be strict after rebase and all 99 hashes match.
          patch-mode: best-effort
          build-budget-minutes: "270"
