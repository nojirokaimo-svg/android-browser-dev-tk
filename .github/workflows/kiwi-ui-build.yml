name: Build Titanium-Kiwi core

on:
  workflow_dispatch:
  push:
    branches:
      - codex/kiwi-ui-port

permissions:
  contents: read
  actions: write

concurrency:
  group: titanium-kiwi-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          # Build #163 saved this exact completed checkpoint on 2026-09-25.
          # Keep Ninja history and object files; a cache miss stops the build.
          restore-key: kiwi-incremental-153-780689451ec17d83ff74d72a733205b5644fa279-stage-11
          require-restore: "true"
          # Apply the verified M154 series and enforce all measured source hashes.
          # Retain .ninja_log, .ninja_deps, generated files and all object files.
          bootstrap-revision: ""
          transition-from-identity: "97a21b7a98e4446142a39bd38190023ebb34cd74:2aaf9dfc919e620564409f94beedaedca5301e81:78e5e45d4bb41035e17ea4da2cc257f496416ac9:validation"
          save-key: kiwi-154-${{ github.sha }}-build
          final-cache-key: kiwi-incremental-154-${{ github.sha }}-build
          titanium-commit: dd8d8a969fb6af762a3c2445ff455f7e48626993
          vanadium-commit: 826316da0994ebd78601a86ba5c0cb34b46ba32d
          chromium-commit: 334b65d254ccc35df4fca82706d1753227b01039
          chromium-version: 154.0.8037.92
          patch-mode: strict
          build-budget-minutes: "270"

  continue-1:
    needs: build
    if: needs.build.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-154-${{ github.sha }}-build
          require-restore: "true"
          save-key: kiwi-154-${{ github.sha }}-continue-1
          final-cache-key: kiwi-incremental-154-${{ github.sha }}-continue-1
          titanium-commit: dd8d8a969fb6af762a3c2445ff455f7e48626993
          vanadium-commit: 826316da0994ebd78601a86ba5c0cb34b46ba32d
          chromium-commit: 334b65d254ccc35df4fca82706d1753227b01039
          chromium-version: 154.0.8037.92
          patch-mode: strict
          build-budget-minutes: "270"

  continue-2:
    needs: continue-1
    if: needs.continue-1.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-154-${{ github.sha }}-continue-1
          require-restore: "true"
          save-key: kiwi-154-${{ github.sha }}-continue-2
          final-cache-key: kiwi-incremental-154-${{ github.sha }}-continue-2
          titanium-commit: dd8d8a969fb6af762a3c2445ff455f7e48626993
          vanadium-commit: 826316da0994ebd78601a86ba5c0cb34b46ba32d
          chromium-commit: 334b65d254ccc35df4fca82706d1753227b01039
          chromium-version: 154.0.8037.92
          patch-mode: strict
          build-budget-minutes: "270"

  continue-3:
    needs: continue-2
    if: needs.continue-2.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-154-${{ github.sha }}-continue-2
          require-restore: "true"
          save-key: kiwi-154-${{ github.sha }}-continue-3
          final-cache-key: kiwi-incremental-154-${{ github.sha }}-continue-3
          titanium-commit: dd8d8a969fb6af762a3c2445ff455f7e48626993
          vanadium-commit: 826316da0994ebd78601a86ba5c0cb34b46ba32d
          chromium-commit: 334b65d254ccc35df4fca82706d1753227b01039
          chromium-version: 154.0.8037.92
          patch-mode: strict
          build-budget-minutes: "270"

  continue-4:
    needs: continue-3
    if: needs.continue-3.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-154-${{ github.sha }}-continue-3
          require-restore: "true"
          save-key: kiwi-154-${{ github.sha }}-continue-4
          final-cache-key: kiwi-incremental-154-${{ github.sha }}-continue-4
          titanium-commit: dd8d8a969fb6af762a3c2445ff455f7e48626993
          vanadium-commit: 826316da0994ebd78601a86ba5c0cb34b46ba32d
          chromium-commit: 334b65d254ccc35df4fca82706d1753227b01039
          chromium-version: 154.0.8037.92
          patch-mode: strict
          build-budget-minutes: "270"

  require-apk:
    needs: [build, continue-1, continue-2, continue-3, continue-4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require one stage to finish the APK
        env:
          S11: ${{ needs.build.outputs.done }}
          S12: ${{ needs.continue-1.outputs.done }}
          S13: ${{ needs.continue-2.outputs.done }}
          S14: ${{ needs.continue-3.outputs.done }}
          S15: ${{ needs.continue-4.outputs.done }}
        run: |
          if [[ "$S11" != true && "$S12" != true && "$S13" != true && "$S14" != true && "$S15" != true ]]; then
            echo "Build and exact-cache continuations ended without producing an APK." >&2
            exit 1
          fi
