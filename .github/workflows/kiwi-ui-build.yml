name: Build Titanium-Kiwi 156.0.8078.73 with ZIP install fix

on:
  workflow_dispatch:
  push:
    branches:
      - codex/kiwi-ui-port
    paths:
      - .github/workflows/kiwi-ui-build.yml
      - .github/actions/kiwi-build-stage/action.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: titanium-kiwi-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          # Resume the exact completed M156.47 checkpoint saved by run 39969342350.
          # Preserve Ninja history and objects; an exact cache miss stops the build.
          restore-key: kiwi-incremental-15647-9f808f2686105ca9a2e35078a8d23d737b9e90de-39969342350-1-continue-1
          require-restore: "true"
          # One explicit source transition; no fallback or checkpoint overwrite.
          bootstrap-revision: ""
          transition-from-identity: "a3e4b86339a8db237d95d8e8e78248c8f6a1df68:2ae4335402eabcc6e025f3400185fe25094d8521:1d17a2e2ee147bb7d6ae2ab6abdb3a2510c17775:validation"
          save-key: kiwi-15673-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          final-cache-key: kiwi-incremental-15673-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          titanium-commit: c21bc5ac921fd9da96c108b40afff202f6e8b0ba
          vanadium-commit: 8ae4b1b8b014862146ff9a09dc8c6fc6e9a0a978
          chromium-commit: 2f9a11097447f226133bc1a31c787291a5eeab98
          chromium-version: 156.0.8078.73
          patch-mode: strict
          build-budget-minutes: "270"

  continue-1:
    needs: build
    if: needs.build.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15673-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          require-restore: "true"
          save-key: kiwi-15673-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          final-cache-key: kiwi-incremental-15673-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          titanium-commit: c21bc5ac921fd9da96c108b40afff202f6e8b0ba
          vanadium-commit: 8ae4b1b8b014862146ff9a09dc8c6fc6e9a0a978
          chromium-commit: 2f9a11097447f226133bc1a31c787291a5eeab98
          chromium-version: 156.0.8078.73
          patch-mode: strict
          build-budget-minutes: "270"

  continue-2:
    needs: continue-1
    if: needs.continue-1.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15673-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          require-restore: "true"
          save-key: kiwi-15673-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          final-cache-key: kiwi-incremental-15673-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          titanium-commit: c21bc5ac921fd9da96c108b40afff202f6e8b0ba
          vanadium-commit: 8ae4b1b8b014862146ff9a09dc8c6fc6e9a0a978
          chromium-commit: 2f9a11097447f226133bc1a31c787291a5eeab98
          chromium-version: 156.0.8078.73
          patch-mode: strict
          build-budget-minutes: "270"

  continue-3:
    needs: continue-2
    if: needs.continue-2.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15673-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          require-restore: "true"
          save-key: kiwi-15673-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          final-cache-key: kiwi-incremental-15673-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          titanium-commit: c21bc5ac921fd9da96c108b40afff202f6e8b0ba
          vanadium-commit: 8ae4b1b8b014862146ff9a09dc8c6fc6e9a0a978
          chromium-commit: 2f9a11097447f226133bc1a31c787291a5eeab98
          chromium-version: 156.0.8078.73
          patch-mode: strict
          build-budget-minutes: "270"

  continue-4:
    needs: continue-3
    if: needs.continue-3.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15673-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          require-restore: "true"
          save-key: kiwi-15673-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-4
          final-cache-key: kiwi-incremental-15673-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-4
          titanium-commit: c21bc5ac921fd9da96c108b40afff202f6e8b0ba
          vanadium-commit: 8ae4b1b8b014862146ff9a09dc8c6fc6e9a0a978
          chromium-commit: 2f9a11097447f226133bc1a31c787291a5eeab98
          chromium-version: 156.0.8078.73
          patch-mode: strict
          build-budget-minutes: "270"

  require-apk:
    needs: [build, continue-1, continue-2, continue-3, continue-4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require one stage to finish the APK
        env:
          S11: ${{ needs.build.outputs.done }}
          S12: ${{ needs.continue-1.outputs.done }}
          S13: ${{ needs.continue-2.outputs.done }}
          S14: ${{ needs.continue-3.outputs.done }}
          S15: ${{ needs.continue-4.outputs.done }}
        run: |
          if [[ "$S11" != true && "$S12" != true && "$S13" != true && "$S14" != true && "$S15" != true ]]; then
            echo "Build and exact-cache continuations ended without producing an APK." >&2
            exit 1
          fi
