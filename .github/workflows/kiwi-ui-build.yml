name: Build Titanium-Kiwi core

on:
  workflow_dispatch:
  push:
    branches:
      - codex/kiwi-ui-port

permissions:
  contents: read
  actions: write

concurrency:
  group: titanium-kiwi-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Verify exact 154.0.8037.126 sources before compilation
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-incremental-154-1a40491d584ff313f1fa36aa34f9131f9877c65d-continue-2
          require-restore: "true"
          audit-only: "true"
          bootstrap-revision: ""
          transition-from-identity: ""
          save-key: kiwi-154126-audit-${{ github.run_id }}-${{ github.run_attempt }}
          titanium-commit: 26092e68277c970eaa94164e9d62438b1fe975ea
          vanadium-commit: 5f832b54eab6d367d09166c49f57b7f6dfa7a5ae
          chromium-commit: 8eaafabb47f12210d524f648b78bce074fa3c83e
          chromium-version: 154.0.8037.126
          patch-mode: best-effort
