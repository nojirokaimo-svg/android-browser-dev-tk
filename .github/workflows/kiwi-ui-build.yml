name: Rebuild Titanium-Kiwi 158.0.8127.92 from M155 feature sources

on:
  workflow_dispatch:
  push:
    branches:
      - codex/kiwi-ui-port
    paths:
      - .github/workflows/kiwi-ui-build.yml
      - .github/actions/kiwi-build-stage/action.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: titanium-kiwi-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          # Resume the exact completed M158.42 checkpoint from successful production run 44683744558.
          # Keep Ninja history and object/generated files; a cache miss stops the build.
          restore-key: kiwi-incremental-15842-7c90b07a378a52fa53dfb022a0413822e26cf70c-44683744558-1-continue-2
          require-restore: "true"
          # Explicit transition from the completed M158.42 identity.
          bootstrap-revision: ""
          transition-from-identity: "9b3a181e48d2223c6482c855d1845ba51b5d0321:e017f70b2fbb4bfaef81a6b1c49ac51ff886aca2:52bdd21723d5db0c9ab11716d38feac74828cf84:validation"
          save-key: kiwi-15892-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          final-cache-key: kiwi-incremental-15892-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          titanium-commit: 124ac01c99f174acc8477711f132cf7c3d52d720
          vanadium-commit: ff04c5bbe8a5f69b27f61af234d3dc84a42c3797
          chromium-commit: aa8057651dc34373e52d0a0cefd7904a11b3e130
          chromium-version: 158.0.8127.92
          patch-mode: strict
          build-budget-minutes: "270"

  continue-1:
    needs: build
    if: needs.build.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15892-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          require-restore: "true"
          save-key: kiwi-15892-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          final-cache-key: kiwi-incremental-15892-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          titanium-commit: 124ac01c99f174acc8477711f132cf7c3d52d720
          vanadium-commit: ff04c5bbe8a5f69b27f61af234d3dc84a42c3797
          chromium-commit: aa8057651dc34373e52d0a0cefd7904a11b3e130
          chromium-version: 158.0.8127.92
          patch-mode: strict
          build-budget-minutes: "270"

  continue-2:
    needs: continue-1
    if: needs.continue-1.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15892-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          require-restore: "true"
          save-key: kiwi-15892-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          final-cache-key: kiwi-incremental-15892-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          titanium-commit: 124ac01c99f174acc8477711f132cf7c3d52d720
          vanadium-commit: ff04c5bbe8a5f69b27f61af234d3dc84a42c3797
          chromium-commit: aa8057651dc34373e52d0a0cefd7904a11b3e130
          chromium-version: 158.0.8127.92
          patch-mode: strict
          build-budget-minutes: "270"

  continue-3:
    needs: continue-2
    if: needs.continue-2.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15892-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          require-restore: "true"
          save-key: kiwi-15892-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          final-cache-key: kiwi-incremental-15892-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          titanium-commit: 124ac01c99f174acc8477711f132cf7c3d52d720
          vanadium-commit: ff04c5bbe8a5f69b27f61af234d3dc84a42c3797
          chromium-commit: aa8057651dc34373e52d0a0cefd7904a11b3e130
          chromium-version: 158.0.8127.92
          patch-mode: strict
          build-budget-minutes: "270"

  continue-4:
    needs: continue-3
    if: needs.continue-3.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15892-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          require-restore: "true"
          save-key: kiwi-15892-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-4
          final-cache-key: kiwi-incremental-15892-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-4
          titanium-commit: 124ac01c99f174acc8477711f132cf7c3d52d720
          vanadium-commit: ff04c5bbe8a5f69b27f61af234d3dc84a42c3797
          chromium-commit: aa8057651dc34373e52d0a0cefd7904a11b3e130
          chromium-version: 158.0.8127.92
          patch-mode: strict
          build-budget-minutes: "270"

  require-apk:
    needs: [build, continue-1, continue-2, continue-3, continue-4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require one stage to finish the APK
        env:
          S11: ${{ needs.build.outputs.done }}
          S12: ${{ needs.continue-1.outputs.done }}
          S13: ${{ needs.continue-2.outputs.done }}
          S14: ${{ needs.continue-3.outputs.done }}
          S15: ${{ needs.continue-4.outputs.done }}
        run: |
          if [[ "$S11" != true && "$S12" != true && "$S13" != true && "$S14" != true && "$S15" != true ]]; then
            echo "Build and exact-cache continuations ended without producing an APK." >&2
            exit 1
          fi

  install-verified-apk:
    needs: require-apk
    if: always() && needs.require-apk.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Titanium-Kiwi-core-158.0.8127.92-arm64
          path: artifacts/repair
      - name: Fetch the signed previous release for overwrite testing
        run: |
          mkdir -p artifacts/previous
          curl -fL --retry 3 --max-time 240 \
            -o artifacts/previous/Titanium-Kiwi-core-158.0.8127.42-arm64-v8a.apk \
            https://github.com/nojirokaimo-svg/android-browser-dev-tk/releases/download/titanium-kiwi-158.0.8127.42-44683744558-1/Titanium-Kiwi-core-158.0.8127.42-arm64-v8a.apk
      - run: bash diagnostics/verify_repair_apk.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash diagnostics/install_repair_apk.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-apk-install-api${{ matrix.api }}-${{ github.run_id }}
          path: verification-output/
          retention-days: 14

  publish-verified-apk:
    needs: [require-apk, install-verified-apk]
    if: always() && needs.require-apk.result == 'success' && needs.install-verified-apk.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Titanium-Kiwi-core-158.0.8127.92-arm64
          path: artifacts/repair
      - name: Publish immutable directly downloadable APK and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag="titanium-kiwi-158.0.8127.92-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cd artifacts/repair
          apk=Titanium-Kiwi-core-158.0.8127.92-arm64-v8a.apk
          test -s "$apk"
          sha256sum "$apk" > SHA256SUMS.txt
          zip -q Titanium-Kiwi-158.0.8127.92.zip "$apk" SHA256SUMS.txt apk-signature.txt
          cat > release-notes.md <<'NOTES'
          M155由来の25機能とZIP読み込み修正を維持した158.0.8127.92です。
          versionCode: 807807374、package: io.github.nojirokaimo.titaniumkiwi。
          署名v2と既存の証明書を照合し、Android API30/36エミュレーターで158.42→158.92→158.42→158.92の上書き検査を通過しました。
          実機での動作とViolentmonkey Settings ZIPエクスポートは未検証です。APKを直接ダウンロードするか、ZIPを展開して中のAPKをインストールしてください。
          NOTES
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Titanium-Kiwi 158.0.8127.92' --notes-file release-notes.md "$apk" Titanium-Kiwi-158.0.8127.92.zip SHA256SUMS.txt apk-signature.txt
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${apk}" >> "$GITHUB_STEP_SUMMARY"
