name: Build Titanium-Kiwi core

on:
  workflow_dispatch:
  push:
    branches:
      - codex/kiwi-ui-port

permissions:
  contents: read
  actions: write

concurrency:
  group: titanium-kiwi-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          # Build #178 completed this exact M155.79 checkpoint. Keep Ninja history and
          # object/generated files; a cache miss stops the build.
          restore-key: kiwi-incremental-15579-4d72ba1aa77606a63f6f57022c2416ffc27cc31b-38576318413-1-continue-2
          require-restore: "true"
          # Verified one-time 155.79 to 155.84 identity transition; retain Ninja history.
          bootstrap-revision: ""
          transition-from-identity: "3f02ed2a05886655b875b21e7c273d8a54fe75ed:8a06a43a04074ab26fa4dc8f8aba915285d56839:a49e2e3d4addfd84e765b52afe230bedb81096db:validation"
          save-key: kiwi-15584-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          final-cache-key: kiwi-incremental-15584-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          titanium-commit: e59e03dc83bc940d73cf29a7683286fca390b393
          vanadium-commit: 20526e052e304b62cf3e80114b423934e2d1c540
          chromium-commit: 5869fe313571d75152b77813cf0a4ee26a4e6df0
          chromium-version: 155.0.8059.84
          patch-mode: strict
          build-budget-minutes: "270"

  continue-1:
    needs: build
    if: needs.build.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15584-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          require-restore: "true"
          save-key: kiwi-15584-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          final-cache-key: kiwi-incremental-15584-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          titanium-commit: e59e03dc83bc940d73cf29a7683286fca390b393
          vanadium-commit: 20526e052e304b62cf3e80114b423934e2d1c540
          chromium-commit: 5869fe313571d75152b77813cf0a4ee26a4e6df0
          chromium-version: 155.0.8059.84
          patch-mode: strict
          build-budget-minutes: "270"

  continue-2:
    needs: continue-1
    if: needs.continue-1.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15584-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          require-restore: "true"
          save-key: kiwi-15584-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          final-cache-key: kiwi-incremental-15584-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          titanium-commit: e59e03dc83bc940d73cf29a7683286fca390b393
          vanadium-commit: 20526e052e304b62cf3e80114b423934e2d1c540
          chromium-commit: 5869fe313571d75152b77813cf0a4ee26a4e6df0
          chromium-version: 155.0.8059.84
          patch-mode: strict
          build-budget-minutes: "270"

  continue-3:
    needs: continue-2
    if: needs.continue-2.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15584-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          require-restore: "true"
          save-key: kiwi-15584-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          final-cache-key: kiwi-incremental-15584-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          titanium-commit: e59e03dc83bc940d73cf29a7683286fca390b393
          vanadium-commit: 20526e052e304b62cf3e80114b423934e2d1c540
          chromium-commit: 5869fe313571d75152b77813cf0a4ee26a4e6df0
          chromium-version: 155.0.8059.84
          patch-mode: strict
          build-budget-minutes: "270"

  continue-4:
    needs: continue-3
    if: needs.continue-3.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-15584-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          require-restore: "true"
          save-key: kiwi-15584-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-4
          final-cache-key: kiwi-incremental-15584-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-4
          titanium-commit: e59e03dc83bc940d73cf29a7683286fca390b393
          vanadium-commit: 20526e052e304b62cf3e80114b423934e2d1c540
          chromium-commit: 5869fe313571d75152b77813cf0a4ee26a4e6df0
          chromium-version: 155.0.8059.84
          patch-mode: strict
          build-budget-minutes: "270"

  require-apk:
    needs: [build, continue-1, continue-2, continue-3, continue-4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require one stage to finish the APK
        env:
          S11: ${{ needs.build.outputs.done }}
          S12: ${{ needs.continue-1.outputs.done }}
          S13: ${{ needs.continue-2.outputs.done }}
          S14: ${{ needs.continue-3.outputs.done }}
          S15: ${{ needs.continue-4.outputs.done }}
        run: |
          if [[ "$S11" != true && "$S12" != true && "$S13" != true && "$S14" != true && "$S15" != true ]]; then
            echo "Build and exact-cache continuations ended without producing an APK." >&2
            exit 1
          fi
