name: Build Titanium-Kiwi core
on:
  push:
    branches: [codex/kiwi-ui-port]
permissions:
  contents: read
concurrency:
  group: titanium-kiwi-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checkpoint-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: work/titanium/chromium/src/out/Default
          key: kiwi-154-6df5931ce5664d898c599acac4bcb0ae005381a4-build
          fail-on-cache-miss: true
      - name: Read auxiliary-search Ninja dependency files without compiling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import sys
          sys.path.insert(0, "kiwi_port")
          from checkpoint_compat import _parse_ninja_deps
          out = Path("work/titanium/chromium/src/out/Default")
          dest = Path("output/checkpoint-diagnostics")
          dest.mkdir(parents=True)
          for pattern in ("obj/chrome/browser/auxiliary_search/*.ninja",
                          "gen/chrome/browser/auxiliary_search/*.d"):
              for p in out.glob(pattern):
                  raw = p.read_bytes()
                  relative = p.relative_to(out)
                  target = dest / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(raw)
                  print(f"FILE {relative} SHA256 {hashlib.sha256(raw).hexdigest()}")
                  print(raw.decode(errors="replace"))
          raw = (out / ".ninja_deps").read_bytes()
          records, paths = _parse_ninja_deps(raw)
          related = [p.decode(errors="replace") for p in paths if b"auxiliary_search" in p or b"magic_stack" in p]
          (dest / "deps-paths.txt").write_text("\n".join(related))
          print("NINJA_DEPS_SHA256", hashlib.sha256(raw).hexdigest())
          print("Related .ninja_deps paths:", "\n".join(related))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kiwi-checkpoint-dependency-diagnostics
          path: output/checkpoint-diagnostics
          retention-days: 7
