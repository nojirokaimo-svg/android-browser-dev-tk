name: Build Titanium-Kiwi core

on:
  workflow_dispatch:
  push:
    branches:
      - codex/kiwi-ui-port

permissions:
  contents: read
  actions: write

concurrency:
  group: titanium-kiwi-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-15579:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          # Restore the exact completed #176 checkpoint and return it untouched.
          restore-key: kiwi-incremental-155-afd27a5830a708ffa9e85d6d02c9fd6f32186bf7-38056044488-1-continue-3
          require-restore: "true"
          audit-only: "true"
          bootstrap-revision: ""
          transition-from-identity: ""
          save-key: kiwi-15579-audit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          final-cache-key: ""
          titanium-commit: 3f02ed2a05886655b875b21e7c273d8a54fe75ed
          vanadium-commit: 8a06a43a04074ab26fa4dc8f8aba915285d56839
          chromium-commit: a49e2e3d4addfd84e765b52afe230bedb81096db
          chromium-version: 155.0.8059.79
          # Diagnostic-only; unresolved conflicts are never compiled.
          patch-mode: best-effort
          build-budget-minutes: "270"
