name: Build Titanium-Kiwi core

on:
  workflow_dispatch:
  push:
    branches:
      - codex/kiwi-ui-port

permissions:
  contents: read
  actions: write

concurrency:
  group: titanium-kiwi-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-155:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - id: audit
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-incremental-154126-d37b865151e144bd2117984a84109ecdd8ba8c09-37564503375-1-continue-2
          require-restore: "true"
          audit-only: "true"
          # Diagnostic only: never compile unresolved conflicts or old file hashes.
          patch-mode: best-effort
          save-key: kiwi-155-audit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          final-cache-key: ""
          transition-from-identity: ""
          titanium-commit: c433018f78b54dea5573f2789ed086022c7ec6f1
          vanadium-commit: c1892f4db7a828b9fcbca9ab6a6898b0a7396fae
          chromium-commit: 3ff7ac5a9224be9156d7f8703a06e22890aafd34
          chromium-version: 155.0.8059.39
