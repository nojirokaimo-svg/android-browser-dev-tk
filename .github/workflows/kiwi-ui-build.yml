name: Build Titanium-Kiwi core

on:
  workflow_dispatch:
  push:
    branches:
      - codex/kiwi-ui-port

permissions:
  contents: read
  actions: write

concurrency:
  group: titanium-kiwi-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          # Build #176 completed this exact M155 checkpoint. Keep Ninja history and
          # object/generated files; a cache miss stops the build.
          restore-key: kiwi-incremental-155-afd27a5830a708ffa9e85d6d02c9fd6f32186bf7-38056044488-1-continue-3
          require-restore: "true"
          # Completed M155 source identity; no transition is needed.
          bootstrap-revision: ""
          transition-from-identity: ""
          save-key: kiwi-155-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          final-cache-key: kiwi-incremental-155-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          titanium-commit: c433018f78b54dea5573f2789ed086022c7ec6f1
          vanadium-commit: c1892f4db7a828b9fcbca9ab6a6898b0a7396fae
          chromium-commit: 3ff7ac5a9224be9156d7f8703a06e22890aafd34
          chromium-version: 155.0.8059.39
          patch-mode: strict
          build-budget-minutes: "270"

  continue-1:
    needs: build
    if: needs.build.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-155-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-build
          require-restore: "true"
          save-key: kiwi-155-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          final-cache-key: kiwi-incremental-155-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          titanium-commit: c433018f78b54dea5573f2789ed086022c7ec6f1
          vanadium-commit: c1892f4db7a828b9fcbca9ab6a6898b0a7396fae
          chromium-commit: 3ff7ac5a9224be9156d7f8703a06e22890aafd34
          chromium-version: 155.0.8059.39
          patch-mode: strict
          build-budget-minutes: "270"

  continue-2:
    needs: continue-1
    if: needs.continue-1.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-155-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-1
          require-restore: "true"
          save-key: kiwi-155-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          final-cache-key: kiwi-incremental-155-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          titanium-commit: c433018f78b54dea5573f2789ed086022c7ec6f1
          vanadium-commit: c1892f4db7a828b9fcbca9ab6a6898b0a7396fae
          chromium-commit: 3ff7ac5a9224be9156d7f8703a06e22890aafd34
          chromium-version: 155.0.8059.39
          patch-mode: strict
          build-budget-minutes: "270"

  continue-3:
    needs: continue-2
    if: needs.continue-2.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-155-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-2
          require-restore: "true"
          save-key: kiwi-155-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          final-cache-key: kiwi-incremental-155-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          titanium-commit: c433018f78b54dea5573f2789ed086022c7ec6f1
          vanadium-commit: c1892f4db7a828b9fcbca9ab6a6898b0a7396fae
          chromium-commit: 3ff7ac5a9224be9156d7f8703a06e22890aafd34
          chromium-version: 155.0.8059.39
          patch-mode: strict
          build-budget-minutes: "270"

  continue-4:
    needs: continue-3
    if: needs.continue-3.outputs.done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      done: ${{ steps.build.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - id: build
        uses: ./.github/actions/kiwi-build-stage
        with:
          restore-key: kiwi-155-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-3
          require-restore: "true"
          save-key: kiwi-155-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-4
          final-cache-key: kiwi-incremental-155-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-continue-4
          titanium-commit: c433018f78b54dea5573f2789ed086022c7ec6f1
          vanadium-commit: c1892f4db7a828b9fcbca9ab6a6898b0a7396fae
          chromium-commit: 3ff7ac5a9224be9156d7f8703a06e22890aafd34
          chromium-version: 155.0.8059.39
          patch-mode: strict
          build-budget-minutes: "270"

  require-apk:
    needs: [build, continue-1, continue-2, continue-3, continue-4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require one stage to finish the APK
        env:
          S11: ${{ needs.build.outputs.done }}
          S12: ${{ needs.continue-1.outputs.done }}
          S13: ${{ needs.continue-2.outputs.done }}
          S14: ${{ needs.continue-3.outputs.done }}
          S15: ${{ needs.continue-4.outputs.done }}
        run: |
          if [[ "$S11" != true && "$S12" != true && "$S13" != true && "$S14" != true && "$S15" != true ]]; then
            echo "Build and exact-cache continuations ended without producing an APK." >&2
            exit 1
          fi
