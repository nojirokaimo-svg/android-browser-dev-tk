name: Diagnose signed Titanium-Kiwi APK installation without rebuilding
on:
  workflow_dispatch:
  push:
    branches: [codex/kiwi-ui-port]
    paths:
      - .github/workflows/kiwi-apk-install-diagnostic.yml
      - diagnostics/**
permissions:
  contents: read
  actions: read
jobs:
  install-test:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[production-rebuild]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Titanium-Kiwi-core-156.0.8078.73-arm64
          run-id: 40938011373
          github-token: ${{ github.token }}
          path: artifacts/73
      - uses: actions/download-artifact@v4
        with:
          name: Titanium-Kiwi-core-156.0.8078.79-arm64
          run-id: 41200960780
          github-token: ${{ github.token }}
          path: artifacts/79
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: pip install websocket-client
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            bash diagnostics/install_apks.sh
            bash diagnostics/runtime_export.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiwi-apk-install-diagnostic-${{ github.run_id }}
          path: diagnostics-output/
          if-no-files-found: warn
          retention-days: 7
