name: Chromium checkpoint build stage
description: Prepare the pinned tree, resume a cached Ninja output directory, and compile within a safe job budget.

inputs:
  restore-key:
    description: Exact cache key produced by the previous stage; empty for a cold stage 1.
    required: false
    default: ""
  save-key:
    description: Cache key to save when the APK is not finished yet.
    required: true
  final-cache-key:
    description: Immutable reusable out/Default key saved when this stage produces the APK.
    required: false
    default: ""
  require-restore:
    description: Refuse a cold build when this stage is intended to resume a checkpoint.
    required: false
    default: "false"
  bootstrap-revision:
    description: Repository revision that created a checkpoint lacking provenance. Empty disables one-time bootstrap.
    required: false
    default: ""
  transition-from-identity:
    description: Exact previous source identity allowed for one patch-level upstream transition.
    required: false
    default: ""
  titanium-commit:
    required: false
    default: "1c05bb4cb552b54bbcfc29ee6f208be4d8129b36"
  vanadium-commit:
    required: false
    default: "9919fca315ddb291441122f7c694bd1cb74be33e"
  chromium-commit:
    required: false
    default: "73934a44f61e6b3878d1943064c141a5a820f5f7"
  chromium-version:
    required: false
    default: "153.0.8010.47"
  patch-mode:
    description: strict for pinned builds; best-effort for a newly resolved upstream.
    required: false
    default: strict
  build-budget-minutes:
    description: Maximum Ninja runtime, leaving time for an immutable checkpoint save.
    required: false
    default: "315"

outputs:
  done:
    description: Whether this stage produced and verified the APK.
    value: ${{ steps.result.outputs.done }}

runs:
  using: composite
  steps:
    - name: Verify complete patch series integrity
      shell: bash
      run: |
        python3 kiwi_port/verify_series.py
        python3 -m py_compile kiwi_port/apply.py kiwi_port/incremental_sources.py
        PYTHONPATH=kiwi_port python3 -m unittest \
          kiwi_port.test_reapply \
          kiwi_port.test_incremental_sources \
          kiwi_port.test_night_mode_patch \
          kiwi_port.test_credentials_patch

    - name: Enforce checkpoint-only resume
      if: inputs.require-restore == 'true' && inputs.restore-key == ''
      shell: bash
      run: |
        echo 'This stage requires an exact checkpoint key; refusing a cold build.' >&2
        exit 1

    - name: Restore exact previous compile checkpoint
      id: restore
      if: inputs.restore-key != ''
      uses: actions/cache/restore@v4
      with:
        path: work/titanium/chromium/src/out/Default
        key: ${{ inputs.restore-key }}
        fail-on-cache-miss: true

    - name: Verify restored checkpoint before preparation
      if: inputs.restore-key != ''
      shell: bash
      run: |
        out=work/titanium/chromium/src/out/Default
        test -f "$out/.ninja_log"
        test -f "$out/build.ninja"
        test -f "$out/args.gn"
        echo "Restored exact checkpoint: ${{ inputs.restore-key }}"
        du -sh "$out"

    - name: Free runner disk
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
        sudo docker system prune --all --force --volumes || true
        df -h

    # build_kiwi_ui_arm64.sh prepares a fresh pinned Chromium checkout and normally
    # runs gn gen at the end.  On a continuation, hide the restored checkpoint in
    # the same out/ directory first.  Preparation can generate a disposable
    # out/Default, but it can never rewrite the cached .ninja_log, args.gn, Ninja
    # files, objects or generated outputs we are resuming from.
    - name: Protect restored out Default from source preparation
      if: inputs.restore-key != ''
      shell: bash
      run: |
        root=work/titanium/chromium/src/out
        checkpoint="$root/.kiwi-restored-Default"
        test ! -e "$checkpoint"
        mv "$root/Default" "$checkpoint"
        echo 'Restored out/Default is protected; preparation cannot modify it.'

    - name: Prepare pinned and patched Chromium tree
      shell: bash
      env:
        KIWI_BUILD_PHASE: prepare
        KIWI_PATCH_MODE: ${{ inputs.patch-mode }}
        KIWI_PATCH_REPORT: ${{ github.workspace }}/output/kiwi-patch-report.md
        TITANIUM_COMMIT: ${{ inputs.titanium-commit }}
        VANADIUM_COMMIT: ${{ inputs.vanadium-commit }}
        CHROMIUM_COMMIT: ${{ inputs.chromium-commit }}
        CHROMIUM_VERSION: ${{ inputs.chromium-version }}
      run: ./build_kiwi_ui_arm64.sh

    - name: Restore untouched checkpoint after source preparation
      if: always() && inputs.restore-key != ''
      shell: bash
      run: |
        root=work/titanium/chromium/src/out
        checkpoint="$root/.kiwi-restored-Default"
        generated="$root/.kiwi-prepare-generated"
        if [[ -d "$checkpoint" ]]; then
          test ! -e "$generated"
          if [[ -e "$root/Default" ]]; then
            mv "$root/Default" "$generated"
          fi
          mv "$checkpoint" "$root/Default"
        elif [[ ! -d "$root/Default" ]]; then
          echo 'No restored checkpoint exists because an earlier prerequisite failed.'
          exit 0
        fi
        test -f "$root/Default/.ninja_log"
        test -f "$root/Default/build.ninja"
        test -f "$root/Default/args.gn"
        echo 'Original restored out/Default is back in place unchanged by prepare/gn gen.'

    - name: Prove one-time provenance bootstrap is source-identical
      if: inputs.restore-key != '' && inputs.bootstrap-revision != ''
      shell: bash
      run: |
        base='${{ inputs.bootstrap-revision }}'
        git fetch --no-tags --depth=1 origin "$base"
        protected_paths=(
          build_kiwi_ui_arm64.sh
          kiwi_port/apply.py
          kiwi_port/manifest.json
          kiwi_port/patches
        )
        if ! git diff --quiet "$base" HEAD -- "${protected_paths[@]}"; then
          echo 'Build/source-producing inputs changed since the checkpoint revision; refusing provenance bootstrap.' >&2
          git diff --name-only "$base" HEAD -- "${protected_paths[@]}" >&2
          exit 1
        fi
        echo "Source-producing inputs match checkpoint revision $base exactly."

    - name: Preserve Ninja history without rewriting restored output
      if: inputs.restore-key != ''
      shell: bash
      run: |
        bootstrap_args=()
        if [[ -n '${{ inputs.bootstrap-revision }}' ]]; then
          bootstrap_args+=(--bootstrap-current)
        fi
        transition_args=()
        if [[ -n '${{ inputs.transition-from-identity }}' ]]; then
          transition_args+=(--transition-from-identity '${{ inputs.transition-from-identity }}')
          generated=work/titanium/chromium/src/out/.kiwi-prepare-generated/args.gn
          test -f "$generated"
          cp "$generated" work/titanium/chromium/src/out/Default/args.gn
        fi
        python3 kiwi_port/incremental_sources.py work/titanium/chromium/src \
          --cache-key '${{ inputs.restore-key }}' \
          --identity '${{ inputs.titanium-commit }}:${{ inputs.vanadium-commit }}:${{ inputs.chromium-commit }}:validation' \
          "${bootstrap_args[@]}" \
          "${transition_args[@]}"
        if [[ -n '${{ inputs.transition-from-identity }}' ]]; then
          export PATH="$GITHUB_WORKSPACE/work/depot_tools:$PATH"
          (cd work/titanium/chromium/src && gn gen out/Default)
        fi

    - name: Continue arm64 APK compilation within the stage budget
      id: compile
      shell: bash
      env:
        KIWI_BUILD_PHASE: compile
        KIWI_BUILD_BUDGET_MINUTES: ${{ inputs.build-budget-minutes }}
        KIWI_INCREMENTAL_NINJA: ${{ inputs.restore-key != '' }}
        CHROMIUM_VERSION: ${{ inputs.chromium-version }}
      run: |
        mkdir -p output
        plan=work/titanium/chromium/src/out/Default/kiwi-incremental-plan.json
        if [[ -f "$plan" ]] && python3 - "$plan" <<'PY'
        import json, sys
        raise SystemExit(0 if json.load(open(sys.argv[1]))["changed_sources"] else 1)
        PY
        then
          set +e
          env INVOKED_BY_BUILD_SERVER=1 /usr/bin/ninja \
            -C work/titanium/chromium/src/out/Default -n chrome_public_apk \
            > output/ninja-plan.log 2>&1
          plan_status=$?
          set -e
          cat output/ninja-plan.log
          if [[ "$plan_status" -ne 0 ]]; then
            exit "$plan_status"
          fi
          if grep -q 'ninja: no work to do' output/ninja-plan.log; then
            echo 'Changed Kiwi sources were not detected by Ninja; refusing stale APK.' >&2
            exit 1
          fi
          date +%s%N > output/incremental-build-start-ns
        fi
        ./build_kiwi_ui_arm64.sh 2>&1 | tee output/build.log

    - name: Record result and checkpoint size
      id: result
      if: always()
      shell: bash
      run: |
        du -sh work/titanium/chromium/src/out/Default || true
        if [[ -f output/BUILD_COMPLETE ]]; then
          echo "done=true" >> "$GITHUB_OUTPUT"
        else
          echo "done=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Save compile checkpoint
      if: ${{ always() && steps.compile.outcome != 'skipped' && steps.result.outputs.done != 'true' && hashFiles('work/titanium/chromium/src/out/Default/.ninja_log') != '' }}
      uses: actions/cache/save@v4
      with:
        path: work/titanium/chromium/src/out/Default
        key: ${{ inputs.save-key }}

    - name: Save completed out/Default for later incremental UI builds
      if: steps.compile.outcome == 'success' && steps.result.outputs.done == 'true' && inputs.final-cache-key != ''
      uses: actions/cache/save@v4
      with:
        path: work/titanium/chromium/src/out/Default
        key: ${{ inputs.final-cache-key }}

    - name: Upload APK and checksum
      if: steps.result.outputs.done == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Titanium-Kiwi-core-${{ inputs.chromium-version }}-arm64
        path: |
          output/Titanium-Kiwi-core-*-arm64-v8a.apk
          output/SHA256SUMS.txt
        if-no-files-found: error
        retention-days: 14

    - name: Upload failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Titanium-Kiwi-core-failure-${{ inputs.save-key }}
        path: |
          work/titanium/chromium/src/out/Default/args.gn
          work/titanium/chromium/src/out/Default/*.log
          output/*.log
          output/kiwi-patch-report.*
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
